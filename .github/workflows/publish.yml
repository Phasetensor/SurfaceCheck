name: Publish to PyPI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a version tag on promoted main history
        run: |
          python -c 'import os,tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["GITHUB_REF"]=="refs/tags/v"+v'
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install '.[validation]'
      - run: coverage run -m pytest && coverage json && python benchmarks/coverage_gate.py
      - run: ruff check . && ruff format --check . && mypy surfacecheck
      - run: python benchmarks/cases.py
      - run: python -m build && twine check --strict dist/*
      - run: cd dist && sha256sum * > ../SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: |
            dist/
            SHA256SUMS
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-build
      - run: cd dist && sha256sum -c ../SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach identical distributions to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
      - name: Verify public distribution digests and installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir github-assets
          (cd github-assets && sha256sum -c ../SHA256SUMS)
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          version=os.environ['GITHUB_REF_NAME'][1:]
          with urllib.request.urlopen(f'https://pypi.org/pypi/surfacecheck/{version}/json') as res:
              public={item['filename']:item['digests']['sha256'] for item in json.load(res)['urls']}
          local={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('dist').iterdir() if p.name.endswith(('.whl','.tar.gz'))}
          assert local == public
          PY
          cd /tmp
          python -m venv installed
          installed/bin/pip install --index-url https://pypi.org/simple "surfacecheck==${GITHUB_REF_NAME#v}"
          installed/bin/python -I -c 'from surfacecheck.pricing import black; assert 7 < black(100,100,1,1,.2) < 9'
