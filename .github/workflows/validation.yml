name: Scientific validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public distributions
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          for name in ('surfacecheck','curvemetric','vintagecheck','bornlens','shotweave'):
              try:
                  with urllib.request.urlopen(f'https://pypi.org/pypi/{name}/json') as response:
                      print(name,json.load(response)['info']['version'])
              except urllib.error.HTTPError as err:
                  if name != 'surfacecheck' or err.code != 404: raise
                  print(name, 'no current public distribution (404)')
          PY
      - run: python -m pip install '.[validation]'
      - run: mypy surfacecheck
      - run: coverage run -m pytest -q
      - run: coverage json -o coverage.json
      - run: coverage report -m && python benchmarks/coverage_gate.py
      - run: ruff check . && ruff format --check .
      - run: python -m build && twine check --strict dist/*
      - name: Verify clean wheel and source installations
        run: |
          for archive in "$GITHUB_WORKSPACE"/dist/*; do
            envdir=$(mktemp -d)
            python -m venv "$envdir"
            "$envdir/bin/pip" install "$archive"
            (cd /tmp && "$envdir/bin/python" -I -c 'from surfacecheck.pricing import black; assert 7 < black(100,100,1,1,.2) < 9')
          done
      - run: python benchmarks/cases.py
      - uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            coverage.json
            results/
            dist/

  compatibility:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest hypothesis
      - run: python -m pytest -q --ignore=tests/test_external.py
      - run: cd /tmp && python -I -c 'from surfacecheck.pricing import black; assert 7 < black(100,100,1,1,.2) < 9'
  acceptance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/scientific-validation'
    needs: [validation, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record acceptance of tested revision
        run: |
          printf '\nVerified revision \x60%s\x60. [CI evidence](https://github.com/%s/actions/runs/%s).\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> docs/acceptance.md
          git config user.name github-actions
          git config user.email github-actions[bot]@users.noreply.github.com
          git add docs/acceptance.md
          git commit -m 'Record successful release acceptance checks'
          git push origin HEAD:scientific-validation
